services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data

  # Optional: retrain the model inside the container instead of using the
  # pre-trained pkl already in models/. Run explicitly with:
  #   docker compose run --rm train
  train:
    build: .
    entrypoint: ["python", "-m", "src.train"]
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
    profiles: ["train"]
